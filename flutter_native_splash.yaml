# Regenerates iOS LaunchScreen and Android 12 splash.
# dart run flutter_native_splash:create
#
# Splash is GitHub's wordmark, not the Invertocat in logo.png.
# https://github.com/logos — Invertocat for the icon, logotype for splash.
flutter_native_splash:
  web: false
  color: "#FFFFFF"
  color_dark: "#121212"
  image: assets/splash/splash.png
  image_dark: assets/splash/splash_dark.png
  ios_content_mode: scaleAspectFit
  android_12:
    color: "#FFFFFF"
    color_dark: "#121212"
    image: assets/splash/splash.png
    image_dark: assets/splash/splash_dark.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#121212"
