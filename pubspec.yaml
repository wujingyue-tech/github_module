name: learn_flutter
description: "A new Flutter project."
publish_to: 'none'
# YYYY.MINOR.PATCH+buildNumber — one value for iOS, Android, and the Settings UI.
# Example: Android Studio Quail 4 is 2026.1.4. Bump PATCH for fixes, MINOR for features,
# YEAR when the product line rolls. Only +buildNumber must increase for store uploads.
version: 2026.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^10.0.0
  go_router: ^18.0.1
  intl: any
  package_info_plus: ^10.2.1
  posthog_flutter: ^5.39.0
  sentry_flutter: ^9.29.0
  shared_preferences: ^2.5.5
  talker: ^5.1.20
  talker_dio_logger: ^5.1.20
  talker_flutter: ^5.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
